name: Raw Material OS Container Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: GHCR에 컨테이너 이미지를 공개할지 선택합니다.
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  packages: write

concurrency:
  group: raw-material-os-container-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deployment contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate deployment files and release contracts
        run: |
          node ops/test-deployment-contract.mjs
          node ops/validate-contracts.mjs
          node ops/validate-material-master-contract.mjs
          node ops/validate-ui-contract.mjs
          node ops/validate-release-readiness.mjs
          node ops/test-goal-contract.mjs
          node ops/test-goal-compiler.mjs
          node ops/test-outcome-ledger.mjs

  container:
    name: Build and optionally publish GHCR image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/raw-material-os"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-${GITHUB_SHA::12}"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
